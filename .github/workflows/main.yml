name: CI for Java application
on:
    push:
        branches:
            - master
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                java-version: '17'
                distribution: 'temurin'
            - name: Build with Maven
              run: mvn clean install
    Code-quality-java:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                java-version: '17'
                distribution: 'temurin'
            - name: Build with Maven
              run: mvn clean install
            - name: Run SonarQube analysis
              run: mvn sonar:sonar -Dsonar.projectKey=sonar-demo-org-may_sonar-demo-may-project -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=sonar-demo-org-may -Dsonar.token=${{ secrets.SONAR_TOKEN }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
